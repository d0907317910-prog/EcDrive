
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101714">
<title>Ec電驅</title>
<style>
:root {
  color-scheme: dark;
  --bg: #101714;
  --panel: #1b2620;
  --line: #34453a;
  --green: #8be0a0;
  --text: #f2f7f3;
  --muted: #aab8ad;
  --red: #ff8e8e;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, sans-serif;
}
header { padding: 22px 16px 12px; }
h1 { margin: 0; font-size: 27px; }
header p { margin: 6px 0; color: var(--muted); }
main { max-width: 760px; margin: auto; padding: 12px; }
nav { display: flex; gap: 8px; margin-bottom: 14px; }
nav button {
  flex: 1; padding: 12px 5px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--panel);
  color: var(--text);
}
nav button.active {
  background: var(--green); color: #102015;
  font-weight: 700;
}
.panel {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 16px; padding: 15px; margin-bottom: 12px;
}
h2 { font-size: 18px; margin: 0 0 12px; }
h3 { font-size: 16px; margin: 0 0 8px; }
p { line-height: 1.5; }
button, input {
  font: inherit;
}
.action {
  padding: 12px; border: 0; border-radius: 10px;
  background: var(--green); color: #102015;
  font-weight: 700; cursor: pointer;
}
.secondary {
  padding: 11px; border: 1px solid var(--line);
  border-radius: 10px; background: #25352b; color: var(--text);
}
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.status { color: var(--muted); font-size: 14px; margin-top: 10px; }
.relay {
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line);
}
.relay:last-child { border-bottom: 0; }
.relay input { width: 23px; height: 23px; accent-color: var(--green); }
.value { font-size: 26px; font-weight: 750; }
.unit { color: var(--muted); font-size: 14px; }
label { display: block; color: var(--muted); margin: 12px 0 5px; }
input[type="text"] {
  width: 100%; padding: 10px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); color: var(--text);
}
pre {
  white-space: pre-wrap; overflow-wrap: anywhere;
  background: var(--bg); padding: 10px; border-radius: 8px;
  font-size: 12px; max-height: 230px; overflow: auto;
}
.hidden { display: none; }
.warning { color: #ffd58c; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Ec電驅</h1>
  <p>ESP32-S3 四路控制・ANT BMS 電池監測</p>
</header>

<main>
<nav>
  <button class="active" data-tab="power">電源控制</button>
  <button data-tab="battery">電池監測</button>
  <button data-tab="settings">設定</button>
</nav>

<section id="power">
  <div class="panel">
    <h2>ESP32-S3 連線</h2>
    <div class="row">
      <button class="action" id="connectRelay">搜尋並連線</button>
      <button class="secondary" id="disconnectRelay">中斷連線</button>
    </div>
    <div class="status" id="relayStatus">尚未連線</div>
  </div>

  <div class="panel">
    <h2>快速控制</h2>
    <div class="row">
      <button class="action" id="allOn">一鍵全開</button>
      <button class="secondary" id="allOff">一鍵全關</button>
    </div>
    <p class="warning">請先確認繼電器實際接線與負載安全，再使用全開功能。</p>
  </div>

  <div class="panel">
    <h2>四路繼電器</h2>
    <div id="relayList"></div>
  </div>
</section>

<section id="battery" class="hidden">
  <div class="panel">
    <h2>ANT BMS 連線</h2>
    <div class="row">
      <button class="action" id="connectBms">搜尋並連線 BMS</button>
      <button class="secondary" id="disconnectBms">中斷連線</button>
    </div>
    <div class="status" id="bmsStatus">尚未連線</div>
  </div>

  <div class="panel">
    <h2>電池資料</h2>
    <p>總電壓</p>
    <div class="value" id="voltage">-- <span class="unit">V</span></div>
    <p>目前電流</p>
    <div class="value" id="current">-- <span class="unit">A</span></div>
    <p>電量 SOC</p>
    <div class="value" id="soc">-- <span class="unit">%</span></div>
    <p class="warning" id="parseStatus">尚未確認封包欄位與倍率，不顯示推測值。</p>
  </div>

  <div class="panel">
    <h2>原始 HEX 封包</h2>
    <div class="status" id="packetInfo">尚未收到資料</div>
    <pre id="hexData">等待 BMS 資料...</pre>
  </div>
</section>

<section id="settings" class="hidden">
  <div class="panel">
    <h2>藍牙設定</h2>
    <label for="deviceName">ESP32-S3 裝置名稱（提示用）</label>
    <input id="deviceName" type="text" value="ESP32-S3-Car">

    <label for="serviceUuid">ESP32 服務 UUID</label>
    <input id="serviceUuid" type="text"
      value="12345678-1234-5678-1234-56789abcdef0">

    <label for="relayUuid">繼電器特徵值 UUID</label>
    <input id="relayUuid" type="text"
      value="12345678-1234-5678-1234-56789abcdef1">

    <button class="action" id="saveSettings">套用設定</button>
    <p class="status">ANT BMS 預設使用服務 FFE0、特徵值 FFE1。</p>
  </div>

  <div class="panel">
    <h2>診斷紀錄</h2>
    <button class="secondary" id="clearLog">清除紀錄</button>
    <pre id="log"></pre>
  </div>
</section>
</main>

<script>
const $ = id => document.getElementById(id);
const logBox = $("log");

function log(message) {
  const time = new Date().toLocaleTimeString();
  logBox.textContent += `[${time}] ${message}\n`;
  logBox.scrollTop = logBox.scrollHeight;
}

document.querySelectorAll("nav button").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll("nav button").forEach(b =>
      b.classList.toggle("active", b === button)
    );
    ["power", "battery", "settings"].forEach(id =>
      $(id).classList.toggle("hidden", id !== button.dataset.tab)
    );
  });
});

let relayDevice = null;
let relayServer = null;
let relayCharacteristic = null;
let bmsDevice = null;
let bmsCharacteristic = null;
let relayStates = [false, false, false, false];

function drawRelays() {
  $("relayList").innerHTML = "";
  for (let i = 0; i < 4; i++) {
    const row = document.createElement("div");
    row.className = "relay";

    const title = document.createElement("strong");
    title.textContent = `繼電器 ${i + 1}`;

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = relayStates[i];
    checkbox.setAttribute("aria-label", `繼電器 ${i + 1}`);
    checkbox.addEventListener("change", async () => {
      try {
        await sendRelay(i + 1, checkbox.checked);
      } catch (error) {
        checkbox.checked = relayStates[i];
        log(`繼電器控制失敗：${error.message}`);
      }
    });

    row.append(title, checkbox);
    $("relayList").appendChild(row);
  }
}

async function sendRelay(number, on) {
  if (!relayCharacteristic) {
    throw new Error("ESP32 尚未連線");
  }

  const command = `R${number}:${on ? 1 : 0}`;
  await relayCharacteristic.writeValue(
    new TextEncoder().encode(command)
  );

  relayStates[number - 1] = on;
  drawRelays();
  log(`已送出 ${command}`);
}

$("connectRelay").addEventListener("click", async () => {
  try {
    if (!navigator.bluetooth) {
      throw new Error("瀏覽器不支援 Web Bluetooth，請使用 Android Chrome 的 HTTPS 網頁");
    }

    const serviceUuid = $("serviceUuid").value.trim();
    const name = $("deviceName").value.trim();

    relayDevice = await navigator.bluetooth.requestDevice({
      filters: [{ name: name }],
      optionalServices: [serviceUuid]
    });

    relayDevice.addEventListener("gattserverdisconnected", () => {
      relayCharacteristic = null;
      relayServer = null;
      $("relayStatus").textContent = "ESP32 已中斷連線";
      log("ESP32 BLE 連線中斷");
    });

    $("relayStatus").textContent = "正在連線...";
    relayServer = await relayDevice.gatt.connect();

    const service = await relayServer.getPrimaryService(serviceUuid);
    relayCharacteristic = await service.getCharacteristic(
      $("relayUuid").value.trim()
    );

    $("relayStatus").textContent = `已連線：${relayDevice.name}`;
    log(`ESP32 連線成功：${relayDevice.name}`);
  } catch (error) {
    $("relayStatus").textContent = `連線失敗：${error.message}`;
    log(`ESP32 連線失敗：${error.message}`);
  }
});

$("disconnectRelay").addEventListener("click", () => {
  if (relayDevice?.gatt?.connected) relayDevice.gatt.disconnect();
  relayCharacteristic = null;
  $("relayStatus").textContent = "已中斷連線";
});

$("allOn").addEventListener("click", async () => {
  try {
    for (let i = 1; i <= 4; i++) {
      await sendRelay(i, true);
      await new Promise(resolve => setTimeout(resolve, 150));
    }
  } catch (error) {
    log(`全開中止：${error.message}`);
  }
});

$("allOff").addEventListener("click", async () => {
  try {
    for (let i = 1; i <= 4; i++) {
      await sendRelay(i, false);
      await new Promise(resolve => setTimeout(resolve, 150));
    }
  } catch (error) {
    log(`全關中止：${error.message}`);
  }
});

$("saveSettings").addEventListener("click", () => {
  log("已套用藍牙設定；請中斷舊連線後重新連線。");
  alert("設定已套用。若要永久保存，請保留這些設定值。");
});

$("clearLog").addEventListener("click", () => {
  logBox.textContent = "";
});

drawRelays();
</script>
</body>
</html>
