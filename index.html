
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102019">
<title>Ec電驅｜四路控制</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#101a15;color:#f1fff5;
font-family:Arial,"Noto Sans TC",sans-serif}
main{max-width:650px;margin:auto}
h1{color:#91f2b5;margin-bottom:5px}
p{color:#a8c0b0}
.card{background:#1b2b22;border:1px solid #35513e;
border-radius:16px;padding:16px;margin:14px 0}
button,input{font:inherit}
button{padding:12px;border:0;border-radius:10px;
background:#91f2b5;color:#102019;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
input{width:100%;padding:11px;border-radius:9px;
border:1px solid #45634d;background:#101a15;color:white}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.relay{background:#263b2d;padding:14px;border-radius:12px}
.relay button{width:100%;margin-top:12px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.off{background:#513131;color:#fff}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabs button{font-size:13px;padding:10px 4px;background:#263b2d;color:white}
.tabs button.active{background:#91f2b5;color:#102019}
.page{display:none}.page.active{display:block}
.field{margin:12px 0}
.field label{display:block;font-size:13px;color:#b9cbbb;margin-bottom:6px}
.log{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;
max-height:220px;overflow:auto;background:#0b120e;padding:10px;border-radius:8px}
small{color:#b9cbbb}
</style>
</head>
<body>
<main>
<h1>Ec電驅</h1>
<p>ESP32-S3 BLE 四路繼電器控制</p>

<div class="card">
  <div id="status">尚未連線</div>
  <p id="deviceInfo">請連接 ESP32-S3</p>
  <button id="connect">搜尋藍牙裝置</button>
</div>

<div class="tabs">
  <button class="active" data-tab="power">電源控制</button>
  <button data-tab="groups">控制組合</button>
  <button data-tab="settings">設定／診斷</button>
</div>

<section id="power" class="page active">
  <div class="card actions">
    <button id="allOn">一鍵全開</button>
    <button id="allOff" class="off">一鍵全關</button>
  </div>
  <div class="grid" id="relays"></div>
  <p><small>畫面顯示的是已送出的控制狀態，不代表已讀回實際接點狀態。</small></p>
</section>

<section id="groups" class="page">
  <div class="card">
    <h3>新增控制組合</h3>
    <div class="field">
      <label>組合名稱</label>
      <input id="groupName" placeholder="例如：夜間燈光">
    </div>
    <div id="groupChecks"></div>
    <button id="saveGroup" style="width:100%;margin-top:12px">儲存組合</button>
  </div>
  <div class="card">
    <h3>已儲存的組合</h3>
    <div id="groupList">尚未建立組合</div>
  </div>
</section>

<section id="settings" class="page">
  <div class="card">
    <h3>藍牙設定</h3>
    <div class="field">
      <label>裝置名稱提示</label>
      <input id="deviceName">
    </div>
    <div class="field">
      <label>Service UUID</label>
      <input id="serviceUuid">
    </div>
    <div class="field">
      <label>Characteristic UUID</label>
      <input id="charUuid">
    </div>
    <button id="saveSettings" style="width:100%">儲存藍牙設定</button>
    <p><small>裝置名稱提示不會改變 ESP32 的實際藍牙名稱。更改實際名稱需要修改並重新燒錄 ESP32 程式。</small></p>
  </div>
  <div class="card">
    <h3>繼電器名稱</h3>
    <div id="nameInputs"></div>
    <button id="saveNames" style="width:100%">儲存名稱</button>
  </div>
  <div class="card">
    <h3>診斷紀錄</h3>
    <button id="disconnect" class="off">中斷連線</button>
    <button id="clearLog">清除紀錄</button>
    <div id="log" class="log">等待操作…</div>
  </div>
</section>
</main>

<script>
const DEFAULT_SERVICE="12345678-1234-5678-1234-56789abcdef0";
const DEFAULT_CHAR="12345678-1234-5678-1234-56789abcdef1";

const read=(key,fallback)=>{
  try{return JSON.parse(localStorage.getItem(key))??fallback}
  catch{return fallback}
};
const store=(key,value)=>localStorage.setItem(key,JSON.stringify(value));
const $=id=>document.getElementById(id);

let settings=read("ec-drive-ble-settings-v1",{
  deviceName:"ESP32-S3-Car",
  serviceUuid:DEFAULT_SERVICE,
  charUuid:DEFAULT_CHAR
});
let names=read("ec-drive-relay-names-v2",[
  "繼電器 1","繼電器 2","繼電器 3","繼電器 4"
]);
let groups=read("ec-drive-groups-v2",[]);
let device=null,characteristic=null;
let states=[false,false,false,false];

function log(message){
  $("log").textContent=
    "["+new Date().toLocaleTimeString()+"] "+message+"\n"+
    $("log").textContent;
}
function showStatus(message){
  $("status").textContent=message;
}
function delay(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}

function renderRelays(){
  $("relays").innerHTML="";
  names.forEach((name,i)=>{
    const box=document.createElement("div");
    box.className="relay";

    const title=document.createElement("strong");
    title.textContent=name;

    const state=document.createElement("p");
    state.textContent=states[i]?"目前狀態：開啟":"目前狀態：關閉";

    const button=document.createElement("button");
    button.textContent=states[i]?"關閉":"開啟";
    if(states[i])button.className="off";
    button.onclick=()=>setRelay(i,!states[i]);

    box.append(title,state,button);
    $("relays").append(box);
  });
}

async function sendCommand(command){
  if(!characteristic)throw Error("尚未連接 ESP32-S3");

  const data=new TextEncoder().encode(command);
  if(characteristic.properties.writeWithoutResponse){
    await characteristic.writeValueWithoutResponse(data);
  }else{
    await characteristic.writeValue(data);
  }
}

async function setRelay(i,on){
  try{
    await sendCommand("R"+(i+1)+":"+(on?1:0));
    states[i]=on;
    renderRelays();
    log(names[i]+"："+(on?"開啟":"關閉")+"，已送出指令");
  }catch(e){
    log("控制失敗："+e.message);
  }
}

async function allRelays(on){
  if(!characteristic){
    log("請先連接藍牙裝置");
    return;
  }
  for(let i=0;i<4;i++){
    await setRelay(i,on);
    await delay(150);
  }
}

async function connectBLE(){
  if(!navigator.bluetooth){
    log("瀏覽器不支援 Web Bluetooth，請使用支援的 Chrome 並以 HTTPS 開啟");
    return;
  }

  try{
    const serviceUuid=$("serviceUuid").value.trim()||DEFAULT_SERVICE;
    const charUuid=$("charUuid").value.trim()||DEFAULT_CHAR;

    device=await navigator.bluetooth.requestDevice({
      acceptAllDevices:true,
      optionalServices:[serviceUuid]
    });

    device.addEventListener("gattserverdisconnected",()=>{
      characteristic=null;
      showStatus("藍牙已中斷");
      $("deviceInfo").textContent="請重新連線";
      log("藍牙連線已中斷");
    });

    showStatus("正在連線…");
    const server=await device.gatt.connect();
    const service=await server.getPrimaryService(serviceUuid);
    characteristic=await service.getCharacteristic(charUuid);

    showStatus("藍牙已連線");
    $("deviceInfo").textContent="裝置："+(device.name||settings.deviceName);
    log("連線成功："+(device.name||"未命名裝置"));
  }catch(e){
    characteristic=null;
    showStatus("連線失敗");
    log("連線失敗："+e.message);
  }
}

function renderNameInputs(){
  $("nameInputs").innerHTML="";
  names.forEach((name,i)=>{
    const wrap=document.createElement("div");
    wrap.className="field";
    const label=document.createElement("label");
    label.textContent="第 "+(i+1)+" 路名稱";
    const input=document.createElement("input");
    input.id="name"+i;
    input.value=name;
    input.maxLength=24;
    wrap.append(label,input);
    $("nameInputs").append(wrap);
  });
}

function renderGroupChecks(){
  $("groupChecks").innerHTML="";
  names.forEach((name,i)=>{
    const label=document.createElement("label");
    label.style.display="block";
    label.style.margin="10px 0";
    const check=document.createElement("input");
    check.type="checkbox";
    check.id="groupCheck"+i;
    check.style.width="auto";
    label.append(check,document.createTextNode(" "+name));
    $("groupChecks").append(label);
  });
}

function renderGroups(){
  const host=$("groupList");
  host.innerHTML="";
  if(!groups.length){
    host.textContent="尚未建立組合";
    return;
  }

  groups.forEach((group,index)=>{
    const row=document.createElement("div");
    row.className="card";

    const title=document.createElement("strong");
    title.textContent=group.name;

    const detail=document.createElement("p");
    detail.textContent=group.relays.map(i=>names[i]).join("、");

    const run=document.createElement("button");
    run.textContent="執行組合";
    run.onclick=async()=>{
      for(const i of group.relays){
        await setRelay(i,true);
        await delay(150);
      }
    };

    const remove=document.createElement("button");
    remove.textContent="刪除";
    remove.className="off";
    remove.style.marginLeft="8px";
    remove.onclick=()=>{
      groups.splice(index,1);
      store("ec-drive-groups-v2",groups);
      renderGroups();
    };

    row.append(title,detail,run,remove);
    host.append(row);
  });
}

$("connect").onclick=connectBLE;
$("allOn").onclick=()=>allRelays(true);
$("allOff").onclick=()=>allRelays(false);

document.querySelectorAll("[data-tab]").forEach(button=>{
  button.onclick=()=>{
    document.querySelectorAll("[data-tab]").forEach(b=>
      b.classList.toggle("active",b===button)
    );
    document.querySelectorAll(".page").forEach(page=>
      page.classList.toggle("active",page.id===button.dataset.tab)
    );
  };
});

$("deviceName").value=settings.deviceName;
$("serviceUuid").value=settings.serviceUuid;
$("charUuid").value=settings.charUuid;

$("saveSettings").onclick=()=>{
  settings={
    deviceName:$("deviceName").value.trim()||"ESP32-S3-Car",
    serviceUuid:$("serviceUuid").value.trim()||DEFAULT_SERVICE,
    charUuid:$("charUuid").value.trim()||DEFAULT_CHAR
  };
  store("ec-drive-ble-settings-v1",settings);
  log("藍牙設定已儲存");
};

$("saveNames").onclick=()=>{
  names=names.map((_,i)=>$("name"+i).value.trim()||"繼電器 "+(i+1));
  store("ec-drive-relay-names-v2",names);
  renderRelays();
  renderNameInputs();
  renderGroupChecks();
  renderGroups();
  log("繼電器名稱已儲存");
};

$("saveGroup").onclick=()=>{
  const name=$("groupName").value.trim();
  const relays=[0,1,2,3].filter(i=>$("groupCheck"+i).checked);

  if(!name||!relays.length){
    log("請輸入組合名稱並至少選擇一路繼電器");
    return;
  }

  groups.push({name,relays});
  store("ec-drive-groups-v2",groups);
  $("groupName").value="";
  renderGroups();
  log("已儲存組合："+name);
};

$("disconnect").onclick=()=>{
  if(device?.gatt?.connected)device.gatt.disconnect();
  else{
    characteristic=null;
    showStatus("尚未連線");
    log("目前沒有藍牙連線");
  }
};
$("clearLog").onclick=()=>$("log").textContent="紀錄已清除";

renderRelays();
renderNameInputs();
renderGroupChecks();
renderGroups();
</script>
</body>
</html>
